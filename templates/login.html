<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#1a73e8">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.json">
<title>로그인 - 위험성평가</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans KR',sans-serif;background:linear-gradient(160deg,#1a73e8 0%,#0d47a1 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:#fff;border-radius:20px;padding:36px 28px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.logo{text-align:center;margin-bottom:24px}
.logo-icon{font-size:48px;margin-bottom:10px}
.logo h1{font-size:20px;font-weight:700;color:#1e293b}
.logo p{font-size:13px;color:#64748b;margin-top:4px}
.tabs{display:flex;background:#f1f5f9;border-radius:12px;padding:4px;margin-bottom:24px;gap:4px}
.tab{flex:1;padding:10px;text-align:center;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;border:none;background:none;color:#64748b;transition:all .15s}
.tab.active{background:#fff;color:#1a73e8;box-shadow:0 1px 4px rgba(0,0,0,.1)}
.form-panel{display:none}
.form-panel.active{display:block}
.form-group{margin-bottom:14px}
.form-label{font-size:13px;font-weight:600;color:#374151;margin-bottom:6px;display:block}
.form-input{width:100%;padding:13px 16px;border:1.5px solid #e2e8f0;border-radius:12px;font-size:15px;background:#f8fafc;transition:all .15s;-webkit-appearance:none;color:#1e293b}
.form-input:focus{outline:none;border-color:#1a73e8;background:#fff;box-shadow:0 0 0 3px rgba(26,115,232,.12)}
.btn-submit{width:100%;padding:14px;background:#1a73e8;color:#fff;border:none;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;margin-top:4px;transition:background .15s}
.btn-submit:active{background:#1557b0}
.flash{padding:12px 16px;border-radius:10px;margin-bottom:16px;font-size:14px;text-align:center}
.flash-error{background:#fee2e2;color:#991b1b}
.flash-success{background:#d1fae5;color:#065f46}
.info-text{font-size:12px;color:#94a3b8;text-align:center;margin-top:16px;line-height:1.6}
.role-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:6px}
.role-btn{padding:10px 6px;border:1.5px solid #e2e8f0;border-radius:10px;text-align:center;cursor:pointer;transition:all .15s;background:#f8fafc;display:block}
.role-btn input{display:none}
.role-btn.selected{border-color:#1a73e8;background:#eff6ff}
.role-btn .role-icon{font-size:20px;margin-bottom:3px}
.role-btn .role-name{font-size:11px;font-weight:600;color:#374151}
.role-btn.selected .role-name{color:#1a73e8}
/* 체크박스 호선 */
.team-check-list{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.team-check-item{display:flex;align-items:center;gap:10px;padding:10px 14px;border:1.5px solid #e2e8f0;border-radius:10px;cursor:pointer;background:#f8fafc;transition:all .15s}
.team-check-item:has(input:checked){border-color:#1a73e8;background:#eff6ff}
.team-check-item input[type=checkbox]{width:17px;height:17px;accent-color:#1a73e8;flex-shrink:0}
.team-check-item span{font-size:14px;font-weight:500;color:#374151}
.team-check-item:has(input:checked) span{color:#1a73e8}
.empty-teams{font-size:12px;color:#f59e0b;padding:8px 0}
</style>
</head>
<body>
<div class="login-card">
  <div class="logo">
    <div class="logo-icon">⚠️</div>
    <h1>위험성평가 시스템</h1>
    <p>비일상 작업 위험성 평가</p>
  </div>

  {% for category, msg in get_flashed_messages(with_categories=true) %}
  <div class="flash flash-{{ category }}">{{ msg }}</div>
  {% endfor %}

  <div class="tabs">
    <button class="tab active" id="tab-login" onclick="switchTab('login')">로그인</button>
    <button class="tab" id="tab-register" onclick="switchTab('register')">회원가입</button>
  </div>

  <!-- 로그인 -->
  <div class="form-panel active" id="panel-login">
    <form method="POST" action="/login">
      <div class="form-group">
        <label class="form-label">아이디</label>
        <input class="form-input" type="text" name="username" placeholder="아이디 입력" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label class="form-label">비밀번호</label>
        <input class="form-input" type="password" name="password" placeholder="비밀번호 입력" autocomplete="current-password" required>
      </div>
      <button class="btn-submit" type="submit">로그인</button>
    </form>
    <p class="info-text">계정이 없으면 회원가입 탭을 눌러주세요</p>
  </div>

  <!-- 회원가입 -->
  <div class="form-panel" id="panel-register">
    <form method="POST" action="/register">
      <div class="form-group">
        <label class="form-label">이름 (실명)</label>
        <input class="form-input" type="text" name="name" placeholder="홍길동" required>
      </div>
      <div class="form-group">
        <label class="form-label">아이디</label>
        <input class="form-input" type="text" name="username" placeholder="영문+숫자 조합" autocomplete="off" required>
      </div>
      <div class="form-group">
        <label class="form-label">비밀번호</label>
        <input class="form-input" type="password" name="password" placeholder="6자 이상" required>
      </div>
      <div class="form-group">
        <label class="form-label">비밀번호 확인</label>
        <input class="form-input" type="password" name="password2" placeholder="비밀번호 재입력" required>
      </div>
      <div class="form-group">
        <label class="form-label">역할 선택</label>
        <div class="role-grid">
          <label class="role-btn selected" id="role-engineer" onclick="selectRole('engineer')">
            <input type="radio" name="role" value="engineer" checked>
            <div class="role-icon">👷</div>
            <div class="role-name">엔지니어</div>
          </label>
          <label class="role-btn" id="role-manager" onclick="selectRole('manager')">
            <input type="radio" name="role" value="manager">
            <div class="role-icon">🚢</div>
            <div class="role-name">호선담당자</div>
          </label>
          <label class="role-btn" id="role-hse" onclick="selectRole('hse')">
            <input type="radio" name="role" value="hse">
            <div class="role-icon">🛡️</div>
            <div class="role-name">HSE 안전</div>
          </label>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">호선 정보 <span style="font-size:11px;color:#94a3b8;font-weight:400">(복수 선택 가능)</span></label>
        {% if teams %}
        <div class="team-check-list">
          {% for team in teams %}
          <label class="team-check-item">
            <input type="checkbox" name="team_ids" value="{{ team.id }}">
            <span>{{ team.name }}</span>
          </label>
          {% endfor %}
        </div>
        {% else %}
        <div class="empty-teams">⚠️ 아직 호선이 없습니다. 관리자에게 등록을 요청하세요.</div>
        {% endif %}
      </div>
      <button class="btn-submit" type="submit">가입하기</button>
    </form>
  </div>
</div>

<script>
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js');

function switchTab(tab) {
  document.getElementById('tab-login').classList.toggle('active', tab === 'login');
  document.getElementById('tab-register').classList.toggle('active', tab === 'register');
  document.getElementById('panel-login').classList.toggle('active', tab === 'login');
  document.getElementById('panel-register').classList.toggle('active', tab === 'register');
}
function selectRole(val) {
  ['engineer','manager','hse'].forEach(r => {
    document.getElementById('role-' + r).classList.toggle('selected', r === val);
  });
  document.querySelector(`input[value="${val}"]`).checked = true;
}
if (location.search.includes('tab=register')) switchTab('register');
</script>
</body>
</html>
